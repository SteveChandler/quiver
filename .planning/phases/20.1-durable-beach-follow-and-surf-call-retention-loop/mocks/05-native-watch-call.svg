  <text x="960" y="653" fill="#F6EFE3" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Tune alert</text>
  <rect x="1054" y="620" width="164" height="54" rx="14" fill="#223B60" stroke="#68809F"/>
  <text x="1136" y="653" fill="#F6EFE3" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Stop watching</text>
  <text x="880" y="720" fill="#91A5BF" font-family="Arial, sans-serif" font-size="14">Duplicate tap returns this same watch.</text>
  <text x="880" y="750" fill="#91A5BF" font-family="Arial, sans-serif" font-size="14">No duplicate rule or notification schedule.</text>

  <rect x="172" y="862" width="1096" height="26" rx="10" fill="#E9DDCB"/>
  <text x="720" y="880" fill="#52647B" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">The existing expert condition-alert composer remains available through Tune alert, but is not the first step.</text>
