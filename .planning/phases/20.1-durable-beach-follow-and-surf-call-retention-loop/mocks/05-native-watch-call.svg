  <text x="1049" y="286" fill="#176C62" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Quiver will interrupt only for a useful update.</text>
  <rect x="880" y="332" width="338" height="264" rx="24" fill="#172A49"/>
  <text x="906" y="374" fill="#91A5BF" font-family="Arial, sans-serif" font-size="14" font-weight="700">WATCHED CONTEXT</text>
  <text x="906" y="418" fill="#F6EFE3" font-family="Arial, sans-serif" font-size="24" font-weight="700">Scripps · 6:40–8:10 AM</text>
  <text x="906" y="456" fill="#BBC7D8" font-family="Arial, sans-serif" font-size="15">Best next 24h · accepted 8:18 PM</text>
  <text x="906" y="488" fill="#BBC7D8" font-family="Arial, sans-serif" font-size="15">Board: 6'8 midlength</text>
  <text x="906" y="530" fill="#F6EFE3" font-family="Arial, sans-serif" font-size="15">Updates enabled</text>
  <text x="906" y="558" fill="#BBC7D8" font-family="Arial, sans-serif" font-size="14">Still on · Call changed · Better nearby · Outcome</text>
