<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Low-fidelity My Coast web dashboard mock</title>
  <desc id="desc">A broad coastal dashboard shows followed beaches and changes for water temperature, tide, water quality, and wind without assuming surf intent.</desc>
  <rect width="1440" height="900" fill="#F6EFE3"/>
