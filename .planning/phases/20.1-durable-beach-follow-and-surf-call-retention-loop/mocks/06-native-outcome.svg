<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Low-fidelity watched call update and outcome flow</title>
  <desc id="desc">Three phone frames show a material call update, a one-tap 1 to 5 outcome, and a truthful saved receipt with optional full session logging.</desc>
  <rect width="1440" height="900" fill="#F6EFE3"/>
  <text x="64" y="62" fill="#0B1830" font-family="Arial, sans-serif" font-size="34" font-weight="700">Useful update → lightweight outcome → truthful receipt</text>
  <text x="64" y="94" fill="#52647B" font-family="Arial, sans-serif" font-size="16">LOW-FIDELITY MOCK · NO GENERIC ENGAGEMENT PUSH · FULL SESSION LOG OPTIONAL</text>

  <!-- Phone 1 -->
  <rect x="54" y="128" width="404" height="704" rx="44" fill="#081426" stroke="#243957" stroke-width="5"/>
  <rect x="76" y="158" width="360" height="644" rx="28" fill="#0F2038"/>
  <text x="100" y="198" fill="#F6EFE3" font-family="Arial, sans-serif" font-size="19" font-weight="700">Notification opened</text>
  <rect x="100" y="228" width="312" height="116" rx="18" fill="#F7E8E3"/>
  <text x="124" y="260" fill="#8A4B40" font-family="Arial, sans-serif" font-size="14" font-weight="700">CALL CHANGED</text>
  <text x="124" y="292" fill="#0B1830" font-family="Arial, sans-serif" font-size="21" font-weight="700">Del Mar now leads</text>
  <text x="124" y="320" fill="#6E5B57" font-family="Arial, sans-serif" font-size="14">Scripps turns onshore earlier.</text>
  <rect x="100" y="366" width="312" height="260" rx="24" fill="#172A49"/>
  <text x="124" y="402" fill="#91A5BF" font-family="Arial, sans-serif" font-size="13" font-weight="700">PREVIOUS WATCH</text>
  <text x="124" y="432" fill="#F6EFE3" font-family="Arial, sans-serif" font-size="17">Scripps · 6:40–8:10 AM</text>
  <line x1="124" y1="454" x2="388" y2="454" stroke="#385171"/>
  <text x="124" y="486" fill="#91A5BF" font-family="Arial, sans-serif" font-size="13" font-weight="700">CURRENT CALL</text>
  <text x="124" y="520" fill="#F6EFE3" font-family="Arial, sans-serif" font-size="26" font-weight="700">Del Mar</text>
  <text x="124" y="552" fill="#F28C45" font-family="Arial, sans-serif" font-size="18" font-weight="700">6:55–8:25 AM</text>
  <text x="124" y="584" fill="#BBC7D8" font-family="Arial, sans-serif" font-size="14">Challenger +12 · updated 5:42 AM</text>
  <text x="100" y="680" fill="#F6EFE3" font-family="Arial, sans-serif" font-size="15">Exact prior/current context, not generic Home.</text>
  <text x="100" y="712" fill="#91A5BF" font-family="Arial, sans-serif" font-size="13">Other push types: Still on · Better nearby · How was it?</text>

  <!-- Phone 2 -->
  <rect x="518" y="128" width="404" height="704" rx="44" fill="#081426" stroke="#243957" stroke-width="5"/>
  <rect x="540" y="158" width="360" height="644" rx="28" fill="#0F2038"/>
  <text x="564" y="198" fill="#F6EFE3" font-family="Arial, sans-serif" font-size="19" font-weight="700">After the watched window</text>
  <rect x="564" y="234" width="312" height="392" rx="26" fill="#172A49"/>
  <text x="590" y="276" fill="#91A5BF" font-family="Arial, sans-serif" font-size="13" font-weight="700">HOW WAS IT?</text>
  <text x="590" y="324" fill="#F6EFE3" font-family="Arial, sans-serif" font-size="30" font-weight="700">Scripps this morning</text>
  <text x="590" y="358" fill="#BBC7D8" font-family="Arial, sans-serif" font-size="14">6:40–8:10 AM · 6'8 midlength · prefilled</text>
  <text x="590" y="414" fill="#F6EFE3" font-family="Arial, sans-serif" font-size="16">Rate the surf</text>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <rect x="590" y="438" width="48" height="52" rx="14" fill="#223B60" stroke="#68809F"/><text x="614" y="471" fill="#F6EFE3">1</text>
    <rect x="648" y="438" width="48" height="52" rx="14" fill="#223B60" stroke="#68809F"/><text x="672" y="471" fill="#F6EFE3">2</text>
    <rect x="706" y="438" width="48" height="52" rx="14" fill="#223B60" stroke="#68809F"/><text x="730" y="471" fill="#F6EFE3">3</text>
    <rect x="764" y="438" width="48" height="52" rx="14" fill="#F28C45"/><text x="788" y="471" fill="#0B1830">4</text>
    <rect x="822" y="438" width="48" height="52" rx="14" fill="#223B60" stroke="#68809F"/><text x="846" y="471" fill="#F6EFE3">5</text>
  </g>
  <rect x="590" y="524" width="280" height="58" rx="15" fill="#F6EFE3"/>
  <text x="730" y="560" fill="#0B1830" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Save rating</text>
  <text x="564" y="678" fill="#91A5BF" font-family="Arial, sans-serif" font-size="13">Offline: queue the outcome and show pending state.</text>
  <text x="564" y="710" fill="#F6EFE3" font-family="Arial, sans-serif" font-size="15">No notes, photos, or full form required.</text>

  <!-- Phone 3 -->
  <rect x="982" y="128" width="404" height="704" rx="44" fill="#081426" stroke="#243957" stroke-width="5"/>
  <rect x="1004" y="158" width="360" height="644" rx="28" fill="#0F2038"/>
  <text x="1028" y="198" fill="#F6EFE3" font-family="Arial, sans-serif" font-size="19" font-weight="700">Saved</text>
  <rect x="1028" y="234" width="312" height="314" rx="26" fill="#DDEFEA"/>
  <circle cx="1184" cy="292" r="30" fill="#2A9D8F"/>
  <path d="M1170 292 L1180 302 L1200 278" fill="none" stroke="#F6EFE3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1184" y="350" fill="#176C62" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Rating saved</text>
  <text x="1184" y="392" fill="#0B1830" font-family="Arial, sans-serif" font-size="17" text-anchor="middle">Added to your Scripps history.</text>
  <text x="1184" y="424" fill="#52647B" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Available when Quiver compares</text>
  <text x="1184" y="446" fill="#52647B" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">similar sessions in the future.</text>
  <text x="1184" y="492" fill="#176C62" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">TRUTHFUL PERSISTENCE RECEIPT</text>
  <rect x="1028" y="578" width="312" height="58" rx="15" fill="#F28C45"/>
  <text x="1184" y="614" fill="#0B1830" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Add details to session log</text>
  <rect x="1028" y="650" width="312" height="54" rx="15" fill="#223B60" stroke="#68809F"/>
  <text x="1184" y="683" fill="#F6EFE3" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Done</text>
  <text x="1028" y="744" fill="#91A5BF" font-family="Arial, sans-serif" font-size="13">Never say “forecast improved” unless that is true.</text>

  <rect x="54" y="856" width="1332" height="30" rx="10" fill="#E9DDCB"/>
  <text x="720" y="877" fill="#52647B" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Every interruption must justify itself with a decision-relevant change or a requested post-window question.</text>
</svg>