[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quiver-content"
version = "0.1.0"
description = "Crawl4AI content pipeline for Quiver beach coverage expansion"
requires-python = ">=3.11"
dependencies = [
    "crawl4ai>=0.4.0",
    "supabase>=2.0.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-mock>=3.12",
]

[project.scripts]
quiver-content = "quiver_content.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["quiver_content*"]
