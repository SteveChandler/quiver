name: Lighthouse CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]
    workflow_dispatch:
        inputs:
            url:
                description: "Override deployment URL (e.g. https://www.quiversurf.app)"
                required: false
                type: string

env:
    NODE_VERSION: "22"

jobs:
    lighthouse:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "yarn"

            - name: Enable Corepack
              run: corepack enable

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Resolve deployment URL
              id: deployment
              env:
                  GH_TOKEN: ${{ github.token }}
                  MANUAL_URL: ${{ inputs.url }}
              run: |
                  # Manual override takes priority
                  if [ -n "$MANUAL_URL" ]; then
                    echo "url=$MANUAL_URL" >> $GITHUB_OUTPUT
                    echo "Using manual URL: $MANUAL_URL"
                    exit 0
                  fi

                  # Determine the commit SHA Vercel deployed
                  if [ "${{ github.event_name }}" = "pull_request" ]; then
                    DEPLOY_SHA="${{ github.event.pull_request.head.sha }}"
                  else
                    DEPLOY_SHA="${{ github.sha }}"
                  fi
                  echo "Looking for Vercel deployment for commit: $DEPLOY_SHA"

                  # Poll GitHub Deployments API for Vercel deployment URL
                  TIMEOUT=600  # 10 minutes
                  INTERVAL=15
                  ELAPSED=0

                  while [ $ELAPSED -lt $TIMEOUT ]; do
                    DEPLOY_ID=$(gh api "repos/${{ github.repository }}/deployments?sha=$DEPLOY_SHA&environment=Preview&per_page=5" \
                      --jq '.[0].id // empty' 2>/dev/null)

                    if [ -z "$DEPLOY_ID" ]; then
                      # Also check Production environment for main branch pushes
                      DEPLOY_ID=$(gh api "repos/${{ github.repository }}/deployments?sha=$DEPLOY_SHA&environment=Production&per_page=5" \
                        --jq '.[0].id // empty' 2>/dev/null)
                    fi

                    if [ -n "$DEPLOY_ID" ]; then
                      # Get the deployment status with the target URL
                      TARGET_URL=$(gh api "repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses?per_page=5" \
                        --jq '[.[] | select(.state == "success")][0].target_url // empty' 2>/dev/null)

                      if [ -n "$TARGET_URL" ]; then
                        echo "url=$TARGET_URL" >> $GITHUB_OUTPUT
                        echo "Found deployment URL: $TARGET_URL"
                        exit 0
                      fi
                    fi

                    echo "Waiting for Vercel deployment... (${ELAPSED}s / ${TIMEOUT}s)"
                    sleep $INTERVAL
                    ELAPSED=$((ELAPSED + INTERVAL))
                  done

                  echo "Timed out waiting for Vercel deployment"
                  exit 1

            - name: Verify deployment is reachable
              env:
                  VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}
              run: |
                  DEPLOY_URL="${{ steps.deployment.outputs.url }}"
                  echo "Checking deployment at: $DEPLOY_URL"

                  BYPASS_HEADER=""
                  if [ -n "$VERCEL_BYPASS_TOKEN" ]; then
                    BYPASS_HEADER="-H x-vercel-protection-bypass:${VERCEL_BYPASS_TOKEN}"
                  fi

                  # Try the health endpoint, fall back to root
                  if curl -sf --max-time 30 $BYPASS_HEADER "${DEPLOY_URL}/api/health" > /dev/null 2>&1; then
                    echo "Health endpoint responded OK"
                  elif curl -sf --max-time 30 $BYPASS_HEADER "${DEPLOY_URL}" > /dev/null 2>&1; then
                    echo "Root page responded OK"
                  else
                    echo "Deployment not reachable at $DEPLOY_URL"
                    exit 1
                  fi

            - name: Install Playwright browsers
              run: |
                  echo "Installing Playwright Chromium browser..."
                  npx playwright install chromium --with-deps

            - name: Run Playwright smoke tests
              id: playwright
              run: |
                  echo "Running Playwright smoke tests against $BASE_URL..."
                  if npx playwright test --grep @smoke --project=guest 2>&1 | tee playwright_output.log; then
                    echo "success=true" >> $GITHUB_OUTPUT
                  else
                    echo "success=false" >> $GITHUB_OUTPUT
                    exit 1
                  fi
              env:
                  CI: true
                  SKIP_AUTH_SETUP: "true"
                  BASE_URL: ${{ steps.deployment.outputs.url }}
                  VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}

            - name: Upload Playwright results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-results-${{ github.run_number }}
                  path: |
                      playwright-report/
                      test-results/
                      playwright_output.log
                  retention-days: 7

            - name: Install Lighthouse CI
              run: |
                  npm install -g @lhci/cli@0.15.1

            - name: Run Lighthouse CI
              id: lighthouse
              run: |
                  DEPLOY_URL="${{ steps.deployment.outputs.url }}"
                  echo "Running Lighthouse CI against: $DEPLOY_URL"

                  EXTRA_HEADERS="{}"
                  if [ -n "$VERCEL_BYPASS_TOKEN" ]; then
                    EXTRA_HEADERS="{\"x-vercel-protection-bypass\":\"$VERCEL_BYPASS_TOKEN\"}"
                    echo "Vercel protection bypass header configured"
                  fi

                  if lhci autorun \
                    --collect.url="${DEPLOY_URL}/" \
                    --collect.url="${DEPLOY_URL}/discover" \
                    --collect.url="${DEPLOY_URL}/map" \
                    --collect.url="${DEPLOY_URL}/spots/blacks-beach" \
                    --collect.url="${DEPLOY_URL}/spots/swamis" \
                    --collect.settings.extraHeaders="$EXTRA_HEADERS" \
                    2>&1 | tee lighthouse_output.log; then
                    echo "success=true" >> $GITHUB_OUTPUT
                  else
                    echo "success=false" >> $GITHUB_OUTPUT
                    exit 1
                  fi
              env:
                  LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
                  VERCEL_BYPASS_TOKEN: ${{ secrets.VERCEL_BYPASS_TOKEN }}

            - name: Upload Lighthouse results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: lighthouse-results-${{ github.run_number }}
                  path: .lighthouseci/
                  retention-days: 30

            - name: Upload Lighthouse output
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: lighthouse-output-${{ github.run_number }}
                  path: lighthouse_output.log
                  retention-days: 7

            - name: Create performance summary
              if: always()
              run: |
                  DEPLOY_URL="${{ steps.deployment.outputs.url }}"

                  echo "## Lighthouse CI Performance Report" >> $GITHUB_STEP_SUMMARY
                  echo "**Run:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
                  echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
                  echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
                  echo "**Deployment:** $DEPLOY_URL" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  echo "### Status" >> $GITHUB_STEP_SUMMARY
                  echo "- **Playwright Smoke Tests:** ${{ steps.playwright.outputs.success == 'true' && 'Passed' || 'Failed' }}" >> $GITHUB_STEP_SUMMARY
                  echo "- **Lighthouse CI:** ${{ steps.lighthouse.outputs.success == 'true' && 'Passed' || 'Failed/Warnings' }}" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  echo "### Playwright Smoke Tests" >> $GITHUB_STEP_SUMMARY
                  echo "Smoke tests run against guest project (unauthenticated)." >> $GITHUB_STEP_SUMMARY
                  echo "Download \`playwright-results-${{ github.run_number }}\` artifact for details." >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  echo "### Audited URLs" >> $GITHUB_STEP_SUMMARY
                  echo "- Home: ${DEPLOY_URL}/" >> $GITHUB_STEP_SUMMARY
                  echo "- Discover: ${DEPLOY_URL}/discover" >> $GITHUB_STEP_SUMMARY
                  echo "- Map: ${DEPLOY_URL}/map" >> $GITHUB_STEP_SUMMARY
                  echo "- Spot (Blacks): ${DEPLOY_URL}/spots/blacks-beach" >> $GITHUB_STEP_SUMMARY
                  echo "- Spot (Swamis): ${DEPLOY_URL}/spots/swamis" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  echo "### Configuration" >> $GITHUB_STEP_SUMMARY
                  echo "- **Runs per URL:** 3" >> $GITHUB_STEP_SUMMARY
                  echo "- **Form Factor:** Mobile (Pixel 5 emulation)" >> $GITHUB_STEP_SUMMARY
                  echo "- **Categories:** Performance, Accessibility, Best Practices, SEO" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  echo "### Thresholds" >> $GITHUB_STEP_SUMMARY
                  echo "- **Performance:** >=70% (warn)" >> $GITHUB_STEP_SUMMARY
                  echo "- **Accessibility:** >=90% (error)" >> $GITHUB_STEP_SUMMARY
                  echo "- **Best Practices:** >=85% (warn)" >> $GITHUB_STEP_SUMMARY
                  echo "- **SEO:** >=85% (warn)" >> $GITHUB_STEP_SUMMARY
                  echo "- **LCP:** <=4000ms" >> $GITHUB_STEP_SUMMARY
                  echo "- **CLS:** <=0.1" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  echo "### Detailed Results" >> $GITHUB_STEP_SUMMARY
                  echo "Download the \`lighthouse-results-${{ github.run_number }}\` artifact for full reports." >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  if [ -f lighthouse_output.log ]; then
                    echo "### Output Log (Last 50 Lines)" >> $GITHUB_STEP_SUMMARY
                    echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                    tail -50 lighthouse_output.log >> $GITHUB_STEP_SUMMARY
                    echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
                  fi

            - name: Notify on failure
              if: failure()
              run: |
                  echo "CI Workflow Failed"
                  echo "Check the artifacts and logs for detailed error information"

                  if [ -f playwright_output.log ]; then
                    echo ""
                    echo "=== Playwright Output (Last 20 Lines) ==="
                    tail -20 playwright_output.log
                  fi

                  if [ -f lighthouse_output.log ]; then
                    echo ""
                    echo "=== Lighthouse Output (Last 20 Lines) ==="
                    tail -20 lighthouse_output.log
                  fi
