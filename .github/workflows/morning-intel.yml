name: Daily Morning Surf Intel

on:
  schedule:
    # Run daily at 6:00 AM PT (13:00 UTC)
    # Note: GitHub Actions cron uses UTC. This runs at 6 AM PDT / 5 AM PST
    # PT is UTC-8 (standard) or UTC-7 (daylight)
    - cron: "0 13 * * *"
  workflow_dispatch: # Allows manual triggering from GitHub Actions UI

env:
  NODE_VERSION: "18"

jobs:
  morning-intel:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "yarn"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Set environment variables
        run: |
          echo "TZ=America/Los_Angeles" >> $GITHUB_ENV
          echo "MORNING_INTEL_ENABLED=true" >> $GITHUB_ENV

      - name: Run Morning Surf Intel
        id: morning_intel
        run: |
          echo "🌊 Generating Morning Surf Intel..."
          echo "📅 $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z')"

          if yarn run morning-intel 2>&1 | tee morning_intel_output.log; then
            echo "✅ Morning Intel completed successfully"
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Morning Intel failed"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MORNING_INTEL_USER_EMAIL: ${{ secrets.MORNING_INTEL_USER_EMAIL }}
          MORNING_INTEL_SPOT_ID: "65d177de-e75a-4ad8-aa0d-48a67c0851b0"
          MORNING_INTEL_SPOT_NAME: "Ocean Beach Pier"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-intel-log-${{ github.run_number }}
          path: morning_intel_output.log
          retention-days: 7

      - name: Create summary report
        if: always()
        run: |
          echo "## 🌊 Morning Surf Intel Report" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M %Z')" >> $GITHUB_STEP_SUMMARY
          echo "**Location:** Ocean Beach Pier, San Diego" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ steps.morning_intel.outputs.success == 'true' && '✅ Success' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f morning_intel_output.log ]; then
            echo "### Output Log" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat morning_intel_output.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "🚨 Morning Surf Intel Failed"
          echo "Check the logs for detailed error information"

          if [ -f morning_intel_output.log ]; then
            echo "Last 10 lines of output:"
            tail -10 morning_intel_output.log
          fi
