# fly.toml app configuration file generated for quiver-ml on 2026-01-14T11:33:49-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'quiver-ml'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[env]
  MODEL_PATH = 'models/bias_model_combined_v1.json'
  MODEL_VERSION = 'combined_v1'
  FALLBACK_MODEL_PATH = 'models/bias_model_ensemble_v1.json'
  USE_ENSEMBLE = 'true'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
