# fly.toml app configuration file generated for quiver-ml on 2026-01-14T11:33:49-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'quiver-ml'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[env]
  MODEL_PATH = 'models/bias_model_v3.json'
  MODEL_VERSION = 'v3'
  FALLBACK_MODEL_PATH = 'models/bias_model_v2.json'
  USE_ENSEMBLE = 'false'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/ping"

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
