# fly.toml app configuration file generated for quiver-ml on 2026-01-14T11:33:49-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'quiver-ml'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[env]
  # ROLLBACK: Disabled combined_v1 model due to severe performance regression
  # combined_v1 showed 16.5% improvement rate (target >55%) and avg -0.59m degradation
  # See docs/postmortems/2026-01-20-ml-model-regression.md for details
  MODEL_PATH = 'models/bias_model_v1.json'
  MODEL_VERSION = 'v1'
  FALLBACK_MODEL_PATH = 'models/bias_model_v1.json'
  USE_ENSEMBLE = 'false'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
